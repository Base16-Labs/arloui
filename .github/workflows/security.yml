name: Security

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]
  schedule:
    # Weekly (Mon 06:00 UTC) so newly-published advisories are caught even
    # without a push.
    - cron: '0 6 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trivy:
    name: trivy (vuln · secret · misconfig)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload SARIF to code scanning
    steps:
      - uses: actions/checkout@v4

      # Vulnerabilities + misconfigurations → SARIF (report-only, surfaced in
      # the Security tab). Non-gating: ignore-unfixed keeps known dev-tooling
      # advisories with no available fix from failing the build.
      - name: Trivy vuln + misconfig scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: sarif
          output: trivy-results.sarif
          exit-code: '0'
          skip-dirs: node_modules,dist,coverage,.next,.expo,.turbo

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif

      # Secrets are a hard gate — fail the run if a credential is committed.
      - name: Trivy secret scan (gate)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          format: table
          exit-code: '1'
          skip-dirs: node_modules,dist,coverage,.next,.expo,.turbo

  audit:
    name: npm audit (published deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci

      # Gate only on what ships to consumers: HIGH+ in production dependencies.
      # (Dev-only tooling advisories are tracked via the Trivy SARIF above.)
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
