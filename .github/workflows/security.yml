name: Security

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]
  schedule:
    # Weekly (Mon 06:00 UTC) so newly-published advisories are caught even
    # without a push.
    - cron: '0 6 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trivy:
    name: trivy (vuln · secret · misconfig)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload SARIF to code scanning
    env:
      SKIP_DIRS: node_modules,dist,coverage,.next,.expo,.turbo
    steps:
      - uses: actions/checkout@v4

      # Install the Trivy CLI directly. This avoids trivy-action's transitive
      # dependency on setup-trivy tags that upstream sometimes deletes (the
      # "unable to resolve aquasecurity/setup-trivy" failures).
      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b "$RUNNER_TEMP/trivy-bin"
          echo "$RUNNER_TEMP/trivy-bin" >> "$GITHUB_PATH"

      # Vulnerabilities + misconfigurations → SARIF (report-only, surfaced in
      # the Security tab). ignore-unfixed keeps known dev-tooling advisories
      # with no available fix from failing the build.
      - name: Trivy vuln + misconfig scan
        run: |
          trivy fs . \
            --scanners vuln,misconfig \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --format sarif \
            --output trivy-results.sarif \
            --skip-dirs "$SKIP_DIRS" \
            --exit-code 0 \
            --no-progress

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif

      # Secrets are a hard gate — fail the run if a credential is committed.
      - name: Trivy secret scan (gate)
        run: |
          trivy fs . \
            --scanners secret \
            --skip-dirs "$SKIP_DIRS" \
            --exit-code 1 \
            --no-progress

  audit:
    name: npm audit (published deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci

      # Gate only on what ships to consumers: HIGH+ in production dependencies.
      # (Dev-only tooling advisories are tracked via the Trivy SARIF above.)
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
