name: Test

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: unit + coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - run: npm install --global npm@11.5.1
      - run: npm ci

      # Vitest (CLI, build-registry) + Jest/RNTL (registry, theme, utils,
      # tokens), all with coverage thresholds enforced.
      - run: npm test
