name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · lint · build · registry · skill
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm registry:build

      - name: Verify registry artifacts
        run: |
          test -f apps/www/public/r/index.json
          test -f apps/www/public/r/button.json
          test -f apps/www/public/r/card.json

      - name: Sync skill (drift check)
        run: pnpm skill:sync

      - name: Detect skill drift
        run: |
          if ! git diff --quiet --exit-code -- packages/skill; then
            echo "::error::packages/skill is out of sync with the implementation. Run \`pnpm skill:sync\` and commit the result."
            git --no-pager diff -- packages/skill
            exit 1
          fi
